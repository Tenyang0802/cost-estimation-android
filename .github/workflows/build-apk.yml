name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            expect
          pip install --quiet buildozer cython

      - name: Patch Buildozer + Build APK
        run: |
          # 打补丁：check_root 直接返回
          P=$(python3 -c "import buildozer; import os; print(os.path.dirname(buildozer.__file__))")/__init__.py
          sed -i 's/def check_root(self):/def check_root(self):\n        return/' "$P"
          
          cd ${{ github.workspace }}
          # expect 创建伪 TTY，让 sdkmanager 的 /dev/tty 可以响应输入
          expect -c '
            set timeout -1
            spawn -noecho buildozer android debug
            expect {
              -re "y/n|agree|license" { send "y\r"; exp_continue }
              -re "\\\[y/N\\\]" { send "y\r"; exp_continue }
              eof { puts "\n[BUILD_COMPLETE]" }
            }
          ' 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimation-apk
          path: ${{ github.workspace }}/bin/*.apk
