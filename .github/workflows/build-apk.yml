name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Buildozer deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --quiet buildozer cython

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          buildozer android debug
        env:
          BUILD_REQUIREMENTS: python3,kivy

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimation-apk
          path: ${{ github.workspace }}/bin/*.apk
