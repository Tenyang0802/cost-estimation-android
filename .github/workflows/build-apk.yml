name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build APK with Buildozer (Docker)
        run: |
          cd ${{ github.workspace }}
          # 创建打包脚本，内置 root 跳过
          cat > build_apk.sh << 'EOSCRIPT'
          #!/bin/bash
          export BUILDOZER_AS_ROOT=1
          yes 2>/dev/null | buildozer android debug
          EOSCRIPT
          chmod +x build_apk.sh
          
          docker run --rm -i \
            -v ${{ github.workspace }}:/app \
            -w /app \
            kivy/buildozer:latest \
            bash build_apk.sh 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimation-apk
          path: ${{ github.workspace }}/bin/*.apk
