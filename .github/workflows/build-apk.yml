name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build APK with Buildozer (Docker)
        run: |
          cd ${{ github.workspace }}
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -v ${{ github.workspace }}/.buildozer:/app/.buildozer \
            -w /app \
            kivy/buildozer:latest \
            android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cost-estimation-apk
          path: ${{ github.workspace }}/bin/*.apk
